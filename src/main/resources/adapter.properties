# Defaults for target-required fields that the EOSC Beyond catalogue does not supply.
default.targetUsers=target_user-research_communities,target_user-research_groups,target_user-research_projects
default.languageAvailabilities=en
# tagline: "name" = copy the service name (lazy default)
default.tagline=name

# Strip HTML tags from the description (the target model expects plain text)
description.stripHtml=true

# Value mapping tables:  map.<field>.<sourceValue>=<targetValue>
# Values without an entry pass through unchanged. An empty target drops the value.
# EOSC Beyond "accessTypes" (virtual/physical) is not the same concept as the
# target "accessModes" (free/paid/...), so it is dropped unless remapped here.
map.accessMode.access_type-virtual=
map.accessMode.access_type-physical=
map.accessMode.access_type-remote=

# Service categories.
# EOSC-Lot-1 v1.0.0 uses the same category vocabulary as EOSC Beyond, so no table is needed.
# EOSC-Lot-1 v2.0.0 replaced it with "service_classification-*", which is translated in two steps:
#   1. map.subcategory.v2.<beyond subcategory>  decides first, when the service has a subcategory
#      with an entry here. Only subcategories that differ from their category default are listed.
#   2. map.category.v2.<beyond category>        is the fallback (the category default).
# A value with no entry passes through unchanged and is rejected if the model does not allow it.
# The assignments are a judgement based on the category descriptions in the model; review them.
map.category.v2.category-access_physical_and_eInfrastructures-compute=service_classification-compute_services
map.category.v2.category-access_physical_and_eInfrastructures-data_storage=service_classification-storage_services
map.category.v2.category-access_physical_and_eInfrastructures-instrument_and_equipment=service_classification-instrumentation_physical_resources
map.category.v2.category-access_physical_and_eInfrastructures-material_storage=service_classification-instrumentation_physical_resources
map.category.v2.category-access_physical_and_eInfrastructures-network=service_classification-networking_services
map.category.v2.category-aggregators_and_integrators-aggregators_and_integrators=service_classification-publishing_discovery
map.category.v2.category-other-other=service_classification-other
map.category.v2.category-processing_and_analysis-data_analysis=service_classification-data_processing_analysis
map.category.v2.category-processing_and_analysis-data_management=service_classification-data_management_curation
map.category.v2.category-processing_and_analysis-measurement_and_materials_analysis=service_classification-data_processing_analysis
map.category.v2.category-security_and_operations-operations_and_infrastructure_management_services=service_classification-infrastructure_operations_services
map.category.v2.category-security_and_operations-security_and_identity=service_classification-infrastructure_operations_services
map.category.v2.category-sharing_and_discovery-applications=service_classification-publishing_discovery
