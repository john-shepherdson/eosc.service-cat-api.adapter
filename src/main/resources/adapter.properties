# Defaults for target-required fields that the EOSC Beyond catalogue does not supply.
# Initial values taken from https://srvcat.cloud.cesnet.cz/services
default.targetUsers=target_user-research_communities,target_user-research_groups,target_user-research_projects
default.languageAvailabilities=en
# tagline: "name" = copy the service name (lazy default)
default.tagline=name

# Strip HTML tags from the description (the target model expects plain text)
description.stripHtml=true

# Value mapping tables:  map.<field>.<sourceValue>=<targetValue>
# Values without an entry pass through unchanged. An empty target drops the value.
# EOSC Beyond "accessTypes" (virtual/physical) is not the same concept as the
# target "accessModes" (free/paid/...), so it is dropped unless remapped here.
map.accessMode.access_type-virtual=
map.accessMode.access_type-physical=
map.accessMode.access_type-remote=
